<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>空洞骑士存档分析器</title>
    <link rel="icon" href="assets/Hatchling.webp" type="image/x-icon">

    <!-- 通用主题 -->
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

    <!-- 游戏切换 -->
    <div class="game-switcher">
        <button id="hkBtn" class="active">Hollow Knight</button>
        <button id="ssBtn">Silksong</button>
    </div>

    <!-- 标题 -->
    <h1 id="pageTitle">Hollow Knight 112% 分析器</h1>

    <!-- 路径提示 -->
    <div class="path-hint-container">
        <span class="path-label">参考存档路径:</span>
        <code id="savePathDisplay">C:\Users\%USERNAME%\AppData\LocalLow\Team Cherry\Hollow Knight</code>
        <button id="copyPathBtn" title="复制路径">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
        </button>
    </div>

    <!-- 控制区 -->
    <div id="controls">
        <input type="file" id="fileInput" accept=".dat">
        <button id="parseBtn">解析存档</button>
    </div>

    <!-- 修改功能控制栏 -->
    <div id="modifierControls" class="modifier-controls" style="display:none;">
        <!-- 修改功能开关 -->
        <label class="toggle-wrapper">
            <span class="toggle-label">存档修改功能</span>
            <input type="checkbox" id="modifierToggle">
        </label>
        
        <!-- 导出按钮 -->
        <button id="exportBtn" style="display:none;">导出修改</button>

        <!-- 猎人日志按钮 -->
        <button id="journalBtn" style="display:none;">浏览猎人日志完成情况</button>
        <button id="rescueBtn" style="display:none;">浏览幼虫/跳蚤收集情况</button>
        <button id="memoryLocketBtn" style="display:none;">浏览忆境纪念盒收集情况</button>
    </div>

    <!-- 修改区 -->
    <div id="modifierUI" class="modifier-panel" style="display:none;">
        <div class="modifier-header">
            <h3>存档修改</h3>
            <div class="modifier-warning">
                修改前请务必备份原存档！
            </div>
        </div>
        <div id="modifierList" class="modifier-grid"></div>
    </div>

    <!-- 猎人日志 -->
    <div id="journalPanel" class="modifier-panel" style="display:none;">
        <div class="modifier-header">
            <h3>猎人日志</h3>
        </div>
        <div id="journalContent"></div>
    </div>

    <div id="rescuePanel" class="modifier-panel" style="display:none;">
        <div class="modifier-header">
            <h3>幼虫 / 跳蚤收集</h3>
        </div>
        <div id="rescueContent"></div>
    </div>

    <div id="memoryLocketPanel" class="modifier-panel" style="display:none;">
        <div class="modifier-header">
            <h3>忆境纪念盒</h3>
        </div>
        <div id="memoryLocketContent"></div>
    </div>

    <!-- 缺失列表 -->
    <div id="missingList"></div>

    <!-- 详细完成度 -->
    <div id="result"></div>

    <!-- 依赖库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <div class="footer">

        <!-- 底部统计 -->
        <span id="busuanzi_container_site_pv" style="display:none">
            小骑士和大黄蜂共访问<span id="busuanzi_value_site_pv"></span>次
        </span>
        <span class="divider">|</span>
        <span id="busuanzi_container_site_uv" style="display:none">
            累计有<span id="busuanzi_value_site_uv"></span>个小骑士和大黄蜂使用
        </span>
        
        <!-- 社交链接 -->
        <div class="social-links">
            <a href="https://github.com/nov1ce-lee/hollowKnightSaveParser" target="_blank" title="GitHub仓库源码" class="social-link">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
            </a>
            <a href="https://space.bilibili.com/22078038" target="_blank" title="B站空间" class="social-link">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.866 0 17.356V9.987c.036-1.51.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a1.623 1.623 0 0 1 .187-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893V9.907c-.017-.764-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373Z"/></svg>
            </a>
            <a href="https://nov1ce-lee.github.io/" target="_blank" title="个人博客" class="social-link">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </a>
        </div>

    </div>

    <!-- 不蒜子统计脚本 -->
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <!-- ========== 核心逻辑 ========== -->
    <script src="js/core/parser.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/calculator.js"></script>
    <script src="js/core/renderer.js"></script>

    <!-- ========== 游戏配置 ========== -->
    <script src="js/games/hollow.js"></script>
    <script src="js/games/silksong.js"></script>
    <script src="js/journal/hollowJournalMap.js"></script>
    <script src="js/journal/silksongJournalMap.js"></script>
    <script src="js/rescue/hollowRescueMap.js"></script>
    <script src="js/rescue/silksongRescueMap.js"></script>
    <script src="js/rescue/memoryLocketMap.js"></script>

    <!-- ========== 主控制 ========== -->
    <script src="js/main.js"></script>

    <script>
        // UI 绑定（纯前端，不涉及业务）
        document.getElementById('hkBtn').onclick = () => switchGame('hollow');
        document.getElementById('ssBtn').onclick = () => switchGame('silksong');
    </script>

</body>
</html>
